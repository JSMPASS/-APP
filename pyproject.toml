[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "habit-checkin"
version = "2.0.0"
description = "计划打卡桌面应用：行测/申论学习打卡、题库、错题反思、总体进度、Word/PDF 报告"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.0",
    "Pillow>=9.0",
    "reportlab>=4.0",
    "numpy>=1.24",
    "pystray>=0.19",
    "pypdf>=3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
habit_checkin = ["resources/*.ico"]

[tool.ruff]
line-length = 120
target-version = "py310"
